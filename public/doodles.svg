<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.05">
  <!-- Hand-drawn school doodles. Repeats as a tile; positions avoid the tile edges so tiles join cleanly. -->

  <!-- atom -->
  <g transform="translate(110 110) rotate(-12)">
    <ellipse cx="0" cy="0" rx="62" ry="22" />
    <ellipse cx="0" cy="0" rx="62" ry="22" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="62" ry="22" transform="rotate(-60)" />
    <circle cx="0" cy="0" r="7" />
  </g>

  <!-- paper plane -->
  <g transform="translate(420 70) rotate(14)">
    <path d="M0 40 L120 0 L70 70 Z" />
    <path d="M120 0 L45 48 L52 86 L70 70" />
    <path d="M-30 70 q20 -6 34 -20 M-46 92 q26 -10 40 -26" stroke-dasharray="6 8" />
  </g>

  <!-- hash / grid -->
  <g transform="translate(290 210) rotate(-8)">
    <path d="M14 0 l-8 70 M40 2 l-8 70 M-6 22 l64 -4 M-10 48 l64 -4" />
  </g>

  <!-- pencil -->
  <g transform="translate(560 250) rotate(38)">
    <path d="M-14 -70 h28 v118 l-14 26 l-14 -26 z" />
    <path d="M-14 -50 h28 M-14 48 h28" />
    <path d="M-5 66 l5 8 l5 -8" />
  </g>

  <!-- open book -->
  <g transform="translate(110 330) rotate(6)">
    <path d="M0 10 q40 -16 70 4 v74 q-30 -20 -70 -4 z" />
    <path d="M70 14 q30 -20 70 -4 v74 q-40 -16 -70 4" />
    <path d="M14 30 q22 -6 42 2 M14 46 q22 -6 42 2 M84 32 q22 -8 42 -2 M84 48 q22 -8 42 -2" />
  </g>

  <!-- test tube with bubbles -->
  <g transform="translate(330 400) rotate(-20)">
    <path d="M0 0 v86 a16 16 0 0 0 32 0 v-86" />
    <path d="M-6 0 h44 M0 50 h32" />
    <circle cx="12" cy="70" r="4" /><circle cx="22" cy="84" r="3" />
    <circle cx="44" cy="-16" r="5" /><circle cx="58" cy="-34" r="3" />
  </g>

  <!-- trophy -->
  <g transform="translate(500 440) rotate(10)">
    <path d="M0 0 h64 v20 a32 32 0 0 1 -64 0 z" />
    <path d="M0 8 h-14 a14 14 0 0 0 14 22 M64 8 h14 a14 14 0 0 1 -14 22" />
    <path d="M32 52 v18 M14 70 h36 v14 h-36 z" />
    <path d="M24 10 l4 8 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -1 z" stroke-width="1.6" />
  </g>

  <!-- light bulb -->
  <g transform="translate(70 520) rotate(-14)">
    <path d="M24 0 a28 28 0 0 1 18 50 q-6 6 -6 14 h-24 q0 -8 -6 -14 a28 28 0 0 1 18 -50 z" />
    <path d="M14 72 h20 M16 80 h16" />
    <path d="M-14 4 l-12 -8 M62 4 l12 -8 M24 -18 v-14" stroke-dasharray="3 6" />
  </g>

  <!-- ruler -->
  <g transform="translate(200 560) rotate(-30)">
    <rect x="0" y="0" width="140" height="28" rx="3" />
    <path d="M14 0 v10 M28 0 v16 M42 0 v10 M56 0 v16 M70 0 v10 M84 0 v16 M98 0 v10 M112 0 v16 M126 0 v10" stroke-width="1.6" />
  </g>

  <!-- graduation cap -->
  <g transform="translate(430 270) rotate(-6)">
    <path d="M0 20 l50 -20 l50 20 l-50 20 z" />
    <path d="M22 30 v22 q28 16 56 0 v-22" />
    <path d="M100 20 v28" /><circle cx="100" cy="52" r="4" />
  </g>

  <!-- formula -->
  <g transform="translate(190 30)" stroke-width="2">
    <path d="M0 0 l18 22 M18 0 l-18 22" />
    <path d="M24 -6 q4 -6 8 0 q2 4 -8 10 h10" stroke-width="1.6" />
    <path d="M44 12 h14 M51 5 v14" />
    <path d="M66 0 l9 22 l9 -22" />
  </g>

  <!-- stars / sparkles -->
  <path d="M600 600 l5 -12 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 z" />
  <path d="M250 330 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z" />
  <path d="M40 240 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z" />

  <!-- loose dots and squiggles -->
  <circle cx="380" cy="180" r="5" /><circle cx="600" cy="150" r="4" /><circle cx="150" cy="450" r="4" />
  <path d="M360 540 q14 -14 28 0 t28 0 t28 0" />
  <path d="M40 30 q10 10 0 20 q-10 10 0 20" />
</svg>
